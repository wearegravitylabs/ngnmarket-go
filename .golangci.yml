version: "2"

run:
  concurrency: 8
  timeout: 120s
  tests: false

linters:
  enable:
    - gochecknoinits
    - goconst
    - revive
    - rowserrcheck
    - unparam
  settings:
    revive:
      severity: warning

formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes: ["github.com/wearegravitylabs"]
